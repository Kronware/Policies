# media-shredder Data Safety Declaration
# For Google Play Console Data Safety Section

app_name: Media Shredder
package_id: com.mediashredder.app

data_collection:
  collects_data: false
  developer_collected_data: []

  third_party_data:
    - provider: Google AdMob
      data_types:
        - Device or other IDs (Advertising ID)
        - App interactions
        - Diagnostics (crash logs, performance data)
      purpose:
        - Advertising or marketing
        - Analytics
      optional: false
      user_can_opt_out: true  # Via device Ads settings
      notes: Only collected for free-tier users. Not collected for Pro users.

    - provider: Google Play Billing
      data_types:
        - Purchase history (managed by Google Play, not the developer)
      purpose:
        - In-app purchases (Pro upgrade)
      optional: true  # Only when user initiates a purchase
      user_can_opt_out: false  # Required to complete a purchase
      notes: >
        Payment is processed entirely by Google Play. The app receives only a
        boolean purchase confirmation. No payment details, name, or billing
        address are received or stored by the developer.

data_shared:
  shared_with_third_parties: false
  # AdMob data sharing is handled by Google under their own policies

security_practices:
  data_encrypted_in_transit: true   # AdMob uses TLS
  data_deletion_request_available: false  # No user data collected by developer
  independent_security_review: false

file_operations:
  all_file_operations: on_device_only
  no_data_leaves_device_from_app: true

foreground_service:
  type: FOREGROUND_SERVICE_DATA_SYNC
  purpose: >
    Used exclusively by the scheduled auto-shredding feature (Pro). When a
    scheduled shred rule fires, the app starts a foreground service to overwrite
    and delete the target files entirely on-device. The DATA_SYNC service type
    is declared as required by Android 14+. No data is synced to any external
    server — all operations are local file overwrites only.
  user_visible_notification: true
  video_demo: MediaShredder_FOREGROUND_SERVICE_DATA_SYNC_schedule_01.mp4
