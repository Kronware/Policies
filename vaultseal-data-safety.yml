# Google Play Data Safety Declaration for VaultSeal
# Application ID: app.kronware.vaultseal
# Publisher: Kronware (kronware.io)

app_id: app.kronware.vaultseal
app_name: VaultSeal
publisher: Kronware
last_updated: "2026-08-30"

overview:
  collects_personal_data: false
  data_shared_with_third_parties: false
  encryption_in_transit: true
  encryption_at_rest: true
  user_can_request_deletion: true
  offline_first: true
  lan_sync:
    enabled: true
    transport: Direct encrypted peer-to-peer local network only
    cloud_or_developer_server: false
    user_authorized_pairing: Six-digit PIN confirmation is required

data_types_collected:
  user_content:
    photos_videos: false
    audio_files: false
    files_docs: false
    clipboard_content: false
    notes: Storage is strictly local and encrypted on-device. Optional LAN sync can transfer encrypted content directly to an authorized local peer; it is never transmitted to developer servers.
  lan_sync_peer_data:
    device_name: Exchanged only with the authorized local peer
    local_network_address: Exchanged only with the authorized local peer
    certificate_fingerprint: Exchanged only with the authorized local peer
    encrypted_vault_manifests: Exchanged only with the authorized local peer
    encrypted_item_payloads: Exchanged only with the authorized local peer
    shared_with_third_parties: false
  personal_identifiers:
    name: false
    email: false
    user_id: false
    phone_number: false
    physical_address: false
  financial_info:
    payment_info: false
    purchase_history: Processed securely through Google Play Billing.

advertising_and_analytics:
  admob:
    enabled_in_free_tier: true
    purpose: App functionality and advertising for free-tier users
    optional_or_required: Required in free tier; removed in Pro tier
    sdk: Google Mobile Ads (AdMob)

security_practices:
  encryption_standard: AES-256-GCM authenticated encryption
  ephemeral_master_keys: Master keys reside in RAM only while vault is unsealed
  biometrics: Supported via Android BiometricPrompt and Android Keystore
  secure_screen_flag: Default screenshot and app-switcher protection (user configurable)
  metadata_stripping: User-toggleable EXIF and location stripping on exports
